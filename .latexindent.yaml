defaultIndent: "  "
lineWidth: 80

specialBeginEnd:
  llave:
    begin: '\\llave\{.*?\}\{'
    end: '\}'
    lookForThis: 1
    bodyCmdOrEnv:
      name: tabular
    additionalIndent: "  "
modifyLineBreaks:
  specialBeginEnd:
    llave:
      specialBeforeCommand: 1
indentAfterItems:
  llave: 1
alignAtAmpersand:
  llave: 1
lookForAlignDelims:
  caption: 1
  llave:
    delims:
      - align: '&'
      - align: '\\{2}'
        alignFinalDoubleBackSlash: 1
        doubleBackSlash: 1
        spacesBeforeDoubleBackSlash: 1
    lookForChilds: 1
modifyLineBreaks:
  mandatoryArguments:
    caption:
      DBSFinishesWithLineBreak: 1
      MandArgBodyStartsOnOwnLine: 1
      RCuBStartsOnOwnLine: 1

  matriz:
    begin: '\\matriz\{.*?\}\{'
    end: '\}'
    lookForThis: 1
    bodyCmdOrEnv:
      name: tabular
    additionalIndent: "  "
modifyLineBreaks:
  specialBeginEnd:
   matriz:
      specialBeforeCommand: 1
indentAfterItems:
  matriz: 1
alignAtAmpersand:
  matriz: 1
lookForAlignDelims:
  caption: 1
  matriz:
    delims:
      - align: '&'
      - align: '\\{2}'
        alignFinalDoubleBackSlash: 1
        doubleBackSlash: 1
        spacesBeforeDoubleBackSlash: 1
    lookForChilds: 1
modifyLineBreaks:
  mandatoryArguments:
    caption:
      DBSFinishesWithLineBreak: 1
      MandArgBodyStartsOnOwnLine: 1
      RCuBStartsOnOwnLine: 1


  deter:
    begin: '\\deter\{.*?\}\{'
    end: '\}'
    lookForThis: 1
    bodyCmdOrEnv:
      name: tabular
    additionalIndent: "  "
modifyLineBreaks:
  specialBeginEnd:
   deter:
      specialBeforeCommand: 1
indentAfterItems:
  deter: 1
alignAtAmpersand:
  deter: 1
lookForAlignDelims:
  caption: 1
  deter:
    delims:
      - align: '&'
      - align: '\\{2}'
        alignFinalDoubleBackSlash: 1
        doubleBackSlash: 1
        spacesBeforeDoubleBackSlash: 1
    lookForChilds: 1
modifyLineBreaks:
  mandatoryArguments:
    caption:
      DBSFinishesWithLineBreak: 1
      MandArgBodyStartsOnOwnLine: 1
      RCuBStartsOnOwnLine: 1

textWrapOptions:
  columns: 80
  multipleSpacesToSingle: 1
  blocksFollow:
    other: \\\\|\\\]|\\item(?:\h|\[)|\\caption(?:\h|\[)# <!-- new bit
    #      ^^^^  <---- new bit
  blocksBeginWith:
    0-9: 1
    other: \\\(
    #      ^^^^  <---- new bit
overwrite: 1
fileExtensionPreference:
  .tex: 1
  .sty: 2
  .cls: 3
  .bib: 4
backupExtension: .bak
# No hago un solo backup
onlyOneBackUp: 1
